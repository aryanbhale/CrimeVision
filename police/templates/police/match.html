{%  extends 'police/base.html' %}
{% block title %}
Police
{% endblock %}

{% block content %}
<html>
    <head>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    </head>
    <body>
        <div class="row jumbotron">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">
                   <h4>Upload Image</h4>
                </div>
                <div class="card-body">
                    <form id="form">
                        {% csrf_token %}
                        <input type="file" accept="image/*" name="image" id="image" onchange="loadFile(event)"/>
                        <br /> <br />
                        <img id="output"/>
                        <hr />
                        <br />
                        <input type="button" class="btn btn-success" id="match" value="Match">
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md" id="show_button">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Result</h3>
                </div>
                <div class="card-body">
                    <div id="cells">
                    
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-2" id="show_button">
            <div class="card">
                <div class="card-header">
                    <h4>Actions</h4>
                </div>
                <div class="card-body">
                    <div >
                        <button class="btn btn-info" onclick="window.location.reload()">Refresh</button>&nbsp;
                        <button class="btn btn-primary" data-toggle="modal" data-target="#exampleModal"> Add</button>
                        <!-- Modal -->
                            <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                <div class="modal-dialog" role="document">
                                <div class="modal-content">
                                    <div class="modal-header">
                                    <h5 class="modal-title" id="exampleModalLabel">Add Criminal Record</h5>
                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                    </div>
                                    <form id="form1">
                                        {% csrf_token %}
                                        <div class="modal-body">
                                            <input type="text" class="form-control" id="key" placeholder="Unique ID" required>
                                            <br>
                                            <input type="text" class="form-control" id="name" placeholder="Full Name" required>
                                            <br>
                                            <input type="number" class="form-control" id="against" placeholder="Against Cases">
                                            <br>
                                            <div class="text-center">
                                            <input type="file" accept="image/*" required name="img" id="img" class="form-control" onchange="loadImgFile(event)"/>
                                            <br>
                                            <img id="img_output"/>
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                        <button type="button" class="btn btn-primary" id="save">Save</button>
                                        </div>
                                    </form>
                                </div>
                                </div>
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>


<script type="text/javascript">
    var loadFile = function(event) {
    var output = document.getElementById('output');
    output.src = URL.createObjectURL(event.target.files[0]);
    output.onload = function() {
      URL.revokeObjectURL(output.src) // free memory
    }
  };

  var loadImgFile = function(event) {
    var output = document.getElementById('img_output');
    output.src = URL.createObjectURL(event.target.files[0]);
    output.onload = function() {
      URL.revokeObjectURL(output.src) // free memory
    }
  };

  $('#match').click(function() {
            var data = new FormData();
            data.append('file', $('#image')[0].files[0]);
            data.append('csrfmiddlewaretoken', '{{ csrf_token }}');
            var imgname  =  $('#image').val();
            var ext =  imgname.substr( (imgname.lastIndexOf('.') +1) );
            if(!imgname) { alert('Please select an image first.'); return; }
            if(ext=='jpg' || ext=='jpeg' || ext=='png' || ext=='gif' || ext=='PNG' || ext=='JPG' || ext=='JPEG') {
                $.ajax({
                    'url': '/police/api/match/',
                    'type': 'POST',
                    'data': data,
                    'async': true,
                    'cache': false,
                    'processData': false,
                    'contentType': false,
                    'enctype': 'multipart/form-data',
                    'success': function(data) {
                        console.log(data);
                        if("detail" in data)
                            if(data['detail'].includes("not success"))
                                alert("No Records found, seems Innocent")
                            else
                                alert(data.detail);
                        else {
                            
                            for(var d in data) {
                                console.log(d);
                                var imgnode = document.createElement("img");
                                var node = document.createElement("p");
                                var cell = document.createElement("div");
                                imgnode.src = 'data:image/png;base64,' + data[d].img.substring(2,data[d].img.length-1);
                                node.innerHTML = "<br>Name : " + data[d].name + "<br> Cases : " + data[d].against;
                                cell.appendChild(imgnode);
                                cell.appendChild(node);
                                cell.style.float = "left";
                                cell.style.marginLeft = "4%";
                                var cells = document.getElementById("cells");
                                cells.appendChild(cell);
                            }
                        }
                    }
                });   
            }
    });


    $('#save').click(function(e) {
            e.preventDefault(); // stop form submit

            var key    = $('#key').val().trim();
            var name   = $('#name').val().trim();
            var imgFile = $('#img')[0].files[0];

            if(!key)     { alert('Please enter a Unique ID.'); return; }
            if(!name)    { alert('Please enter the Full Name.'); return; }
            if(!imgFile) { alert('Please select an image.'); return; }

            var ext = imgFile.name.split('.').pop().toLowerCase();
            var allowed = ['jpg','jpeg','png','gif'];
            if(allowed.indexOf(ext) === -1) {
                alert('Invalid file type. Use jpg, jpeg, png or gif.');
                return;
            }

            var data = new FormData();
            data.append('file', imgFile);
            data.append('csrfmiddlewaretoken', '{{ csrf_token }}');
            data.append('key', key);
            data.append('name', name);
            data.append('against', $('#against').val());

            $('#save').prop('disabled', true).text('Saving...');

            $.ajax({
                'url': '/police/api/add-record/',
                'type': 'POST',
                'data': data,
                'async': true,
                'cache': false,
                'processData': false,
                'contentType': false,
                'success': function(response) {
                    console.log(response);
                    $('#save').prop('disabled', false).text('Save');
                    if(response.detail && response.detail === 'record added successfully.') {
                        alert('Record added! Remember to retrain the model before matching.');
                        $('#exampleModal').modal('hide');
                        $('#form1')[0].reset();
                        $('#img_output').attr('src','');
                    } else {
                        alert('Error: ' + JSON.stringify(response));
                    }
                },
                'error': function(xhr) {
                    $('#save').prop('disabled', false).text('Save');
                    alert('Server error: ' + xhr.status + ' ' + xhr.responseText);
                }
            });
    });

</script>
</html>
{% endblock %}
